version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: whatsapp-flow-postgres
    environment:
      POSTGRES_DB: whatsapp_flows
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - whatsapp-flow-network

  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: whatsapp-flow-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: whatsapp_flows_library
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./database/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - whatsapp-flow-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: whatsapp-flow-redis
    command: redis-server --appendonly yes --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - whatsapp-flow-network

  # Elasticsearch for Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: whatsapp-flow-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - whatsapp-flow-network

  # Application (Development)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: whatsapp-flow-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/whatsapp_flows
      MONGODB_URL: mongodb://admin:admin@mongodb:27017/whatsapp_flows_library?authSource=admin
      REDIS_URL: redis://:redis123@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "3001:3001"
      - "9229:9229" # Debug port
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - mongodb
      - redis
      - elasticsearch
    networks:
      - whatsapp-flow-network
    command: npm run dev

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  elasticsearch_data:

networks:
  whatsapp-flow-network:
    driver: bridge